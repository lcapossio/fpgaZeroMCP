name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy tools/ registry/ server.py --ignore-missing-imports

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: pytest tests/ -v -m "not integration" --cov=tools --cov=registry --cov=server --cov-report=term-missing

  integration:
    name: Integration tests (OSS CAD Suite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OSS CAD Suite
        env:
          # Authenticated API calls get a per-repo quota; unauthenticated ones
          # share 60 req/h across the runner's IP and flake under load.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(curl -s --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest \
            | python3 -c "import sys,json;[print(a['browser_download_url']) for a in json.load(sys.stdin)['assets'] if 'linux-x64' in a['name']]")
          if [ -z "$URL" ]; then
            echo "Could not resolve OSS CAD Suite download URL" >&2
            exit 1
          fi
          curl --retry 3 -fSL "$URL" | tar -xz -C $HOME
          echo "$HOME/oss-cad-suite/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/ -v -m "integration"
