[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpgazero-mcp"
version = "0.8.0"
description = "MCP server giving AI assistants a complete FPGA toolchain -- lint, simulate, synthesize, place-and-route, and a live IP core registry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Leonardo Capossio (bard0)", email = "hello@bard0.com"}]
keywords = ["fpga", "mcp", "hdl", "verilog", "vhdl", "yosys", "nextpnr", "eda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# ruff pinned: new ruff minors enable new rules and break CI without any code change
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.8", "ruff==0.14.2", "build", "twine"]

[project.urls]
Homepage = "https://github.com/lcapossio/fpgaZeroMCP"
Repository = "https://github.com/lcapossio/fpgaZeroMCP"
Issues = "https://github.com/lcapossio/fpgaZeroMCP/issues"

[project.scripts]
fpgazero-mcp = "fpgazero_mcp.server:main"

[tool.hatch.build.targets.wheel]
# Single top-level package. Nothing else is installed: `tools`, `registry`,
# `server` and `cores` are far too generic to own in site-packages.
packages = ["src/fpgazero_mcp"]
# cores/ is a user-writable working directory in a dev checkout, so ship only
# the two bundled demo cores rather than whatever happens to be on disk.
exclude = ["**/__pycache__", "src/fpgazero_mcp/cores/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/fpgazero_mcp/cores/uart_tx" = "fpgazero_mcp/cores/uart_tx"
"src/fpgazero_mcp/cores/fifo" = "fpgazero_mcp/cores/fifo"

[tool.hatch.build.targets.sdist]
include = [
    "src/fpgazero_mcp/",
    "tests/",
    "example.py",
    "verible_lsp_wrapper.py",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
    "pytest.ini",
]
exclude = ["**/__pycache__", "src/fpgazero_mcp/cores/**"]

[tool.hatch.build.targets.sdist.force-include]
"src/fpgazero_mcp/cores/uart_tx" = "src/fpgazero_mcp/cores/uart_tx"
"src/fpgazero_mcp/cores/fifo" = "src/fpgazero_mcp/cores/fifo"
